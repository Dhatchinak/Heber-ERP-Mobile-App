name: bhc_erp
description: Bishop Heber College Unified ERP System
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # Networking
  http: ^1.1.0
  
  # UI & Animations
  google_fonts: ^6.1.0
  intl: ^0.18.1
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Image & File Handling
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # PDF & Printing
  printing: ^5.14.3
  pdf: ^3.10.8
  
  # Utilities
  http_parser: ^4.0.2
  share_plus: ^12.0.2
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/bhclogo.png
    - assets/logo.png
    - assets/fonts/   
    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"