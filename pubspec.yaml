name: bhc_erp
description: Bishop Heber College Unified ERP System
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # Networking
  http: ^1.1.0
  
  # UI & Animations
  google_fonts: ^6.1.0
  intl: ^0.18.1
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Additional
  image_picker: ^1.0.5
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/bhclogo.png
    - assets/logo.png