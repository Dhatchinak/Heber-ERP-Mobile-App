name: bhc_erp
description: Bishop Heber College Unified ERP System
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # Networking
  http: ^1.1.0
  
  # UI & Animations
  google_fonts: ^6.1.0
  intl: ^0.18.1
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Image & File Handling
  image_picker: ^1.0.7   # ← keep this (for picking images)
  file_picker: ^8.0.0    # ← keep this (for file selection)
  path_provider: ^2.1.2  # ← keep this (for file paths)
  path: ^1.9.0           # ← keep this (for path operations)
  
  # PDF & Printing
  printing: ^5.14.3
  pdf: ^3.10.8
  
  # Utilities
  http_parser: ^4.0.2
  share_plus: ^12.0.2
  open_file: ^3.3.2
  
  # REMOVED: image_cropper: ^5.0.1  (not needed - you have custom crop implementation)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/bhclogo.png
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"